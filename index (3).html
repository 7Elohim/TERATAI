   // Update time and date every second
   function updateTimeAndDate() {
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    timeEl.textContent = `${hours}:${minutes}`;
    const day = now.getDate().toString().padStart(2, '0');
    const month = (now.getMonth() + 1).toString().padStart(2, '0');
    const year = now.getFullYear();
    dateEl.textContent = `${day}/${month}/${year}`;
   }
   updateTimeAndDate();
   setInterval(updateTimeAndDate, 1000);

   // Battery API with proper update
   async function initBattery() {
    if (!('getBattery' in navigator)) {
     document.getElementById('batteryLevel').textContent = '';
     document.getElementById('batteryIcon').style.display = 'none';
     return;
    }
    try {
     const battery = await navigator.getBattery();
     const batteryLevelEl = document.getElementById('batteryLevel');
     const batteryIcon = document.getElementById('batteryIcon');

     function updateAll() {
      const levelPercent = Math.round(battery.level * 100);
      batteryLevelEl.textContent = levelPercent + '%';

      if (levelPercent > 80) {
       batteryIcon.className = 'fas fa-battery-full text-lg neon-text-white';
      } else if (levelPercent > 60) {
       batteryIcon.className = 'fas fa-battery-three-quarters text-lg neon-text-white';
      } else if (levelPercent > 40) {
       batteryIcon.className = 'fas fa-battery-half text-lg neon-text-white';
      } else if (levelPercent > 20) {
       batteryIcon.className = 'fas fa-battery-quarter text-lg neon-text-white';
      } else {
       batteryIcon.className = 'fas fa-battery-empty text-lg neon-text-red';
      }
     }

     updateAll();

     battery.addEventListener('levelchange', updateAll);
     battery.addEventListener('chargingchange', updateAll);
    } catch (error) {
     console.error('Battery API error:', error);
     document.getElementById('batteryLevel').textContent = '';
     document.getElementById('batteryIcon').style.display = 'none';
    }
   }
   initBattery();

   // More accurate network speed meter implementation
   const speedMeterEl = document.getElementById('speedMeter');
   const testFileUrl = 'https://placehold.co/512x512.png?text=SpeedTest';
   const testRuns = 3;
   const intervalMs = 5000;

   async function measureSpeedRun() {
    try {
     let totalBits = 0;
     let totalTime = 0;
     for (let i = 0; i < testRuns; i++) {
      const startTime = performance.now();
      const response = await fetch(testFileUrl + '&cache=' + Math.random(), { cache: 'no-store' });
      const blob = await response.blob();
      const endTime = performance.now();
      const duration = (endTime - startTime) / 1000;
      const bitsLoaded = blob.size * 8;
      totalBits += bitsLoaded;
      totalTime += duration;
     }
     const speedBps = totalBits / totalTime;
     const speedKbps = speedBps / 1024;
     speedMeterEl.textContent = speedKbps.toFixed(0) + ' Kbps';
    } catch (e) {
     speedMeterEl.textContent = 'N/A';
    }
   }

   measureSpeedRun();
   setInterval(measureSpeedRun, intervalMs);

   async function fetchLatestVideos() {

      `https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${PLAYLIST_ID}&part=snippet&maxResults=15`

    } catch (error) {

     return [];
    }
   }

   function createVideoItem(video) {
    const videoId = video.snippet.resourceId.videoId;

     playVideo(videoId);
    };

    const thumbnail = document.createElement('img');
    thumbnail.src = thumbnailUrl;
    thumbnail.alt = title + ' thumbnail, high resolution YouTube video thumbnail image';
    thumbnail.className = 'object-cover w-full h-full';

    thumbWrapper.appendChild(thumbnail);

    const infoDiv = document.createElement('div');
    infoDiv.className = 'flex flex-col justify-center flex-grow';

    const titleEl = document.createElement('h2');
    titleEl.className = 'text-white text-base font-semibold leading-tight neon-text';
    titleEl.textContent = title.length > 50 ? title.slice(0, 47) + '...' : title;

    infoDiv.appendChild(viewsEl);

   function playVideo(videoId) {

   function playAll() {

    player.src = `https://www.youtube.com/embed?listType=playlist&list=${PLAYLIST_ID}&autoplay=1&rel=0`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    resetVideoInfoToPlaylist();
    setPlayAllButtonActive(true);
   }

   function setPlayAllButtonActive(active) {
    const btn = document.getElementById('playAllBtn');
    const icon = btn.querySelector('i');
    const text = document.getElementById('playAllText');
    if (active) {
     btn.classList.add('active');
     icon.classList.add('neon-text-red');
     icon.classList.remove('neon-text');
     text.classList.add('neon-text-red');
     text.classList.remove('neon-text');
     btn.style.backgroundColor = 'transparent';
    } else {
     btn.classList.remove('active');
     icon.classList.remove('neon-text-red');
     icon.classList.add('neon-text');
     text.classList.remove('neon-text-red');
     text.classList.add('neon-text');
     btn.style.backgroundColor = 'transparent';
    }
   }

   function resetPlayAllButton() {
    setPlayAllButtonActive(false);
   }

   function handlePlayAllClick() {
    const btn = document.getElementById('playAllBtn');
    if (btn.classList.contains('active')) {

     return;
    }
    setPlayAllButtonActive(true);
    playAll();
    // After 2 seconds revert to original green neon

    }, 2000);
   }

   async function init() {
    const videos = await fetchLatestVideos();
    const videoList = document.getElementById('videoList');

     videoList.innerHTML = '<p class="text-center text-gray-400">Tidak ada video terbaru.</p>';

    videos.forEach((video) => {

   document.getElementById('downloadBtn').addEventListener('click', async () => {
    const player = document.getElementById('youtubePlayer');
    const src = player.src;
    const url = new URL(src);
    let videoId = null;
    if (url.searchParams.has('v')) {
     videoId = url.searchParams.get('v');
    } else if (url.pathname.startsWith('/embed/')) {
     videoId = url.pathname.split('/embed/')[1].split('?')[0];
    }
    if (!videoId) {
     alert('Tidak ada video yang sedang diputar untuk diunduh.');
     return;
    }
    const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
    window.open(videoUrl, '_blank');
   });

function handleSearch(event) {
  event.preventDefault();
  const input = document.getElementById('searchInput');
  const url = input.value.trim();
  if (!url) return false;

  const videoId = extractVideoId(url);
  const playlistId = extractPlaylistId(url);

  console.log("videoId:", videoId);
  console.log("playlistId:", playlistId);

  const player = document.getElementById('youtubePlayer');

  if (videoId) {
    player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    updateVideoInfoById(videoId);
    resetPlayAllButton();
  } else if (playlistId) {
    player.src = `https://www.youtube.com/embed?listType=playlist&list=${playlistId}&autoplay=1&rel=0`;
    resetVideoInfoToPlaylist(playlistId);
    setPlayAllButtonActive(true);

    setTimeout(() => {
      resetPlayAllButton();
    }, 2000);
  } else {
    alert('Link YouTube tidak valid. Masukkan link video atau playlist yang benar.');
    return false;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
  input.value = '';
  return false;
}

function extractVideoId(url) {
  try {
    const parsedUrl = new URL(url);

    // Format ?v=VIDEO_ID
    if (parsedUrl.searchParams.has('v')) {
      return parsedUrl.searchParams.get('v');
    }

    // Format youtu.be/VIDEO_ID
    if (parsedUrl.hostname === 'youtu.be') {
      return parsedUrl.pathname.slice(1);
    }

    // Format /live/VIDEO_ID
    const liveMatch = parsedUrl.pathname.match(/\/live\/([^/?]+)/);
    if (liveMatch && liveMatch[1]) {
      return liveMatch[1];
    }

    return null;
  } catch (e) {
    return null;
  }
}

function extractPlaylistId(url) {
  try {
    const parsedUrl = new URL(url);
    if (
      parsedUrl.hostname.includes('youtube.com') &&
      parsedUrl.searchParams.has('list')
    ) {
      return parsedUrl.searchParams.get('list');
    }
    return null;
  } catch {
    return null;
  }
}

async function updateVideoInfoById(videoId) {
  try {
    const response = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&id=${videoId}&part=snippet,statistics`
    );
    if (!response.ok) {
      throw new Error('Gagal mengambil data video');
    }

    const data = await response.json();
    if (!data.items || data.items.length === 0) {
      throw new Error('Video tidak ditemukan');
    }

    const video = data.items[0];
    const title = video.snippet.title;
    const channelTitle = video.snippet.channelTitle;
    const viewCount = video.statistics.viewCount;

    document.getElementById('videoTitle').textContent = title;
    document.getElementById('videoAuthor').textContent = 'oleh ' + channelTitle;
    document.getElementById('videoInfo').textContent = `${Number(viewCount).toLocaleString('id-ID')} x ditonton`;
  } catch (error) {
    document.getElementById('videoTitle').textContent = 'Video YouTube';
    document.getElementById('videoAuthor').textContent = '';
    document.getElementById('videoInfo').textContent = '';
  }
}

function resetVideoInfoToPlaylist(playlistId) {
  document.getElementById('videoTitle').textContent = 'Playlist';
  document.getElementById('videoAuthor').textContent = '';
  document.getElementById('videoInfo').textContent = '';
}
